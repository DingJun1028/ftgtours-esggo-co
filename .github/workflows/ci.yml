name: FTG Journey CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Install dependencies (with corepack pnpm enable)
      - name: Enable pnpm via corepack
        run: corepack enable pnpm && pnpm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Run lint
      - name: Run lint
        run: pnpm run lint

      # 6. Run build
      - name: Run build
        run: pnpm run build

      # 6. Run tests
      - name: Run tests
        run: pnpm run test || echo "No test script defined, skipping..."

      # 7. Report result
      - name: Report CI status
        if: always()
        run: echo "CI completed for ${{ github.sha }}"