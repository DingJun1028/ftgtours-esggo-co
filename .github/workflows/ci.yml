name: FTG Journey CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node BEFORE pnpm. This job previously had no setup-node at all
      #    and ran corepack against whatever the runner image happened to ship
      #    (Node 20) — pnpm 11.x requires Node >= 22.13 because it imports
      #    node:sqlite, so the job failed with ERR_UNKNOWN_BUILTIN_MODULE.
      #    That is the same class of failure ci-cd.yml hit in a22f699. Pinning
      #    Node here makes the job independent of the runner default.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it imports node:sqlite).
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # 3. Install dependencies (pin pnpm to match deploy.yml; a bare major can
      #    resolve to a version whose lockfileVersion mismatches pnpm-lock.yaml,
      #    which breaks `pnpm install --frozen-lockfile`)
      - name: Enable pnpm via corepack
        run: corepack enable pnpm && corepack prepare pnpm@11.15.1 --activate && pnpm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Run lint
      - name: Run lint
        run: pnpm run lint

      # 5b. Design token gate: Tailwind silently drops classes that are not
      # defined in tailwind.config.js, so this failure is invisible to lint and
      # build. Audit exits non-zero on any undefined ftg-*/font-* class.
      - name: Audit design tokens
        run: pnpm run audit:tokens

      # 6. Run build
      - name: Run build
        run: pnpm run build

      # 6. Run tests
      # NOTE: no `|| echo` fallback — a real test failure must fail CI.
      - name: Run tests
        run: pnpm run test

      # 7. Report result
      - name: Report CI status
        if: always()
        run: echo "CI completed for ${{ github.sha }}"