name: FTG Journey CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 3. Install dependencies
      - name: Setup Python (if needed)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # 4. Run typecheck / lint
      - name: Run lint
        run: pnpm run lint

      # 5. Run build
      - name: Run build
        run: pnpm run build

      # 6. Run tests (if any)
      - name: Run tests
        run: pnpm run test || echo "No test script defined, skipping..."

      # 7. Report result
      - name: Report CI status
        if: always()
        run: |
          echo "CI completed for ${{ github.sha }}"