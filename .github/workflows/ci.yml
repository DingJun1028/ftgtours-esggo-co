name: FTG Journey CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js + pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 3. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Run lint
      - name: Run lint
        run: pnpm run lint

      # 5. Run build
      - name: Run build
        run: pnpm run build

      # 6. Run tests
      - name: Run tests
        run: pnpm run test || echo "No test script defined, skipping..."

      # 7. Report result
      - name: Report CI status
        if: always()
        run: echo "CI completed for ${{ github.sha }}"