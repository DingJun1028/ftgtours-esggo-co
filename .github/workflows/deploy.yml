name: Deploy FTG Tours Website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin the exact version: a bare major can fail version resolution.
          version: '11.15.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it imports node:sqlite).
          # Node 20 on the runner is both too old for pnpm and deprecated
          # by GitHub Actions, so pin 22 here.
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          # `gh secret set` strips the trailing newline, and OpenSSH refuses to
          # parse a PEM/OpenSSH key that does not end with one:
          #   "Load key ...: error in libcrypto"
          # printf '%s\n' (not %s) restores it.
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port 22
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy to VPS
        run: |
          cd dist
          tar czf /tmp/ftgtours-dist.tar.gz .
          scp /tmp/ftgtours-dist.tar.gz vps:/tmp/
          # /var/www/ftgtours is owned by a non-login UID, so the deploy user
          # cannot write there directly; it does have passwordless sudo.
          # Unpack to a staging dir owned by the deploy user, then rsync over
          # with --delete so removed assets cannot linger in production.
          ssh vps "set -e; rm -rf /tmp/ftgtours-stage && mkdir -p /tmp/ftgtours-stage \
            && tar xzf /tmp/ftgtours-dist.tar.gz -C /tmp/ftgtours-stage \
            && sudo rsync -a --delete /tmp/ftgtours-stage/ /var/www/ftgtours/ \
            && sudo chown -R \$(stat -c '%u:%g' /var/www/ftgtours) /var/www/ftgtours \
            && rm -rf /tmp/ftgtours-stage /tmp/ftgtours-dist.tar.gz \
            && echo deployed"

      - name: Verify
        run: |
          curl -sI https://ftgtours.esggo.co/ | head -1
          curl -sI https://journey.ftgtours.esggo.co/ | head -1
