name: Deploy FTG Tours Website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      # 部署腳本自身的變更必須能觸發部署，否則改了 deploy.yml 只會靜默不生效
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin the exact version: a bare major can fail version resolution.
          version: '11.15.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it imports node:sqlite).
          # Node 20 on the runner is both too old for pnpm and deprecated
          # by GitHub Actions, so pin 22 here.
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          # Heredoc, not printf '%s': printf strips the trailing newline and
          # yields a 418-byte key that OpenSSL rejects with "error in libcrypto".
          # Reproduced locally against this exact key before patching.
          cat > ~/.ssh/id_ed25519 <<'KEYEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          KEYEOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port 22
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy to VPS
        run: |
          cd dist
          tar czf /tmp/ftgtours-dist.tar.gz .
          scp /tmp/ftgtours-dist.tar.gz vps:/tmp/
          # 5T-Trustworthy: 不再就地解壓覆蓋。原流程 `tar xzf` 只寫入不刪除，
          # 被刪除的檔案（例：71 張 PNG，167.6MB）會永久留在磁碟並逐次累積。
          # 改為「發布到時間戳目錄 → 原子 symlink 切換」：
          #   - 每版獨立目錄，天然無殘留
          #   - ln -s + mv -T 走 rename(2)，切換期間沒有「路徑不存在」的空窗
          #   - 保留前兩版供人工回滾
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          TS=$(date +%Y%m%d-%H%M%S)
          REL="/var/www/releases/${TS}"
          mkdir -p "$REL"
          tar xzf /tmp/ftgtours-dist.tar.gz -C "$REL"

          if [ -L /var/www/ftgtours ]; then
            # 正常路徑：原子 symlink 切換（rename(2)）
            ln -s "$REL" /var/www/ftgtours.tmp
            mv -T /var/www/ftgtours.tmp /var/www/ftgtours
          else
            # 首次遷移：現場是實體目錄，先移到 releases 下再建立 symlink
            if [ -d /var/www/ftgtours ]; then
              mv /var/www/ftgtours "/var/www/releases/pre-${TS}"
            fi
            ln -s "$REL" /var/www/ftgtours
          fi

          # 只保留最近兩版，其餘回收
          ls -1dt /var/www/releases/*/ 2>/dev/null | tail -n +3 | xargs -r rm -rf

          echo "--- 部署結果 ---"
          echo "current -> $(readlink -f /var/www/ftgtours)"
          du -sh /var/www/ftgtours
          echo "releases retained:"
          ls -1dt /var/www/releases/*/ | head -3
          REMOTE

      - name: Verify
        run: |
          set -euo pipefail
          for u in https://ftgtours.esggo.co/ https://journey.ftgtours.esggo.co/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u")
            echo "${u} -> HTTP ${code}"
            [ "$code" = "200" ] || { echo "::error::${u} 非 200"; exit 1; }
          done
          # SPA fallback 會把任何路徑回 index.html，故以大小區分真實資源與 404
          idx=$(curl -sS --max-time 30 https://ftgtours.esggo.co/ | wc -c)
          img=$(curl -sS --max-time 60 https://ftgtours.esggo.co/images/logo.webp | wc -c)
          echo "index=${idx}B  logo.webp=${img}B"
          [ "$img" -gt 1000 ] || { echo "::error::logo.webp 未正確部署（疑似 404 fallback）"; exit 1; }
