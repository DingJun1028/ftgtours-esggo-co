name: Deploy FTG Tours Website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - 'tailwind.config.*'
      # 部署腳本自身的變更必須能觸發部署，否則改了 deploy.yml 只會靜默不生效
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin the exact version: a bare major can fail version resolution.
          version: '11.15.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it imports node:sqlite).
          # Node 20 on the runner is both too old for pnpm and deprecated
          # by GitHub Actions, so pin 22 here.
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          # Heredoc, not printf '%s': printf strips the trailing newline and
          # yields a 418-byte key that OpenSSL rejects with "error in libcrypto".
          # Reproduced locally against this exact key before patching.
          cat > ~/.ssh/id_ed25519 <<'KEYEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          KEYEOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port 22
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy to VPS
        run: |
          cd dist
          tar czf /tmp/ftgtours-dist.tar.gz .
          scp /tmp/ftgtours-dist.tar.gz vps:/tmp/
          # 5T-Trustworthy: 不再就地解壓覆蓋。原流程 `tar xzf` 只寫入不刪除，
          # 被刪除的檔案（例：71 張 PNG，167.6MB）會永久留在磁碟並逐次累積。
          #
          # 曾嘗試「發布目錄 + 原子 symlink 切換」（/var/www/releases/<ts>），
          # 但部署帳號對 /var/www/ 沒有建目錄權限：
          #   mkdir: cannot create directory '/var/www/releases': Permission denied
          # 該帳號只能寫 /var/www/ftgtours/ 內部，故改為在原地重建。
          #
          # 安全設計：先解壓到 /tmp 並驗證完整性，確認無誤後才清空目標目錄。
          # 若解壓或驗證失敗，舊站完全未被動到 —— 不會出現空站。
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          STAGE=$(mktemp -d)
          trap 'rm -rf "$STAGE"' EXIT

          tar xzf /tmp/ftgtours-dist.tar.gz -C "$STAGE"
          [ -f "$STAGE/index.html" ] || { echo "::error::解壓後缺少 index.html"; exit 1; }
          [ -d "$STAGE/assets" ]     || { echo "::error::解壓後缺少 assets/"; exit 1; }

          BEFORE=$(du -sh /var/www/ftgtours 2>/dev/null | cut -f1)
          cd /var/www/ftgtours
          # 保留 .well-known（憑證驗證路徑），其餘全部清空 —— 這就是根治舊檔累積的關鍵
          find . -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +
          cp -a "$STAGE"/. .

          AFTER=$(du -sh . | cut -f1)
          echo "--- 部署結果 ---"
          echo "before=${BEFORE}  after=${AFTER}"
          echo "index.html: $([ -f index.html ] && echo present || echo MISSING)"
          echo "assets/: $(ls assets 2>/dev/null | wc -l) 個檔"
          echo "殘留 .png: $(find . -name '*.png' | wc -l) 個"
          echo "webp: $(find . -name '*.webp' | wc -l) 個"
          REMOTE

      - name: Verify
        run: |
          set -uo pipefail
          # 5T-Trackable: 部署後需容許傳播延遲 —— nginx/Cloudflare 可能仍在重新
          # 驗證剛被替換的內容。首次實測曾在部署完成 0.14s 後即發出請求而誤判失敗，
          # 隨後 6/6 重試全數 200。單次失敗不足以判定部署失敗，改為退避重試。
          check() {  # $1=url $2=min_bytes $3=label
            local url=$1 minb=$2 label=$3 code size
            for attempt in 1 2 3 4 5; do
              size=$(curl -sS --max-time 45 "$url" 2>/dev/null | wc -c)
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" 2>/dev/null || echo 000)
              echo "  [${label}] attempt ${attempt}: HTTP ${code}, ${size}B"
              if [ "$code" = "200" ] && [ "$size" -ge "$minb" ]; then
                return 0
              fi
              sleep $((attempt * 4))
            done
            return 1
          }

          # SPA fallback 會把任何路徑回 index.html，故以位元組數下限區分真實資源與 404
          check https://ftgtours.esggo.co/ 500 首頁 || { echo "::error::ftgtours 首頁異常"; exit 1; }
          check https://journey.ftgtours.esggo.co/ 500 journey || { echo "::error::journey 網域異常"; exit 1; }
          check https://ftgtours.esggo.co/images/logo.webp 1000 logo.webp \
            || { echo "::error::logo.webp 未正確部署（疑似 404 fallback）"; exit 1; }
          echo "所有端點驗證通過"
