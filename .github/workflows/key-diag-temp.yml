name: Key Diagnostics (TEMP)
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect stored key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/probe
          chmod 600 ~/.ssh/probe
          echo "bytes: $(wc -c < ~/.ssh/probe)"
          echo "cr_count: $(tr -cd '\r' < ~/.ssh/probe | wc -c)"
          echo "line_count: $(wc -l < ~/.ssh/probe)"
          echo "first_line: $(head -1 ~/.ssh/probe)"
          echo "last_line: $(tail -1 ~/.ssh/probe)"
          echo "sha256: $(sha256sum ~/.ssh/probe | cut -d' ' -f1)"
          echo "--- ssh-keygen parse ---"
          ssh-keygen -y -f ~/.ssh/probe 2>&1 | head -3
          echo "--- ssh -V ---"
          ssh -V 2>&1
